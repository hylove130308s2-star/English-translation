
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Translation Test</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f7f5fb;
  color: #444052;
}

header {
  background: #dcd5f5;
  padding: 28px 18px;
  text-align: center;
  border-radius: 0 0 28px 28px;
}

header h1 { margin: 0; font-size: 25px; }
header p { color: #686080; font-size: 13px; }

main {
  max-width: 650px;
  margin: 22px auto;
  padding: 0 16px 40px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 20px;
  margin-bottom: 16px;
  box-shadow: 0 4px 15px #aaa1c51c;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 13px;
  font-size: 14px;
  cursor: pointer;
  background: #eeeaf8;
  color: #665c80;
}

button.active {
  background: #a99bdb;
  color: white;
}

.tabs button { flex: 1; }

.primary {
  background: #a99bdb;
  color: white;
  width: 100%;
  margin-top: 12px;
}

.secondary {
  background: #eeeaf8;
  width: 100%;
  margin-top: 10px;
}

.question {
  background: #f5f2fc;
  padding: 22px 16px;
  border-radius: 15px;
  font-size: 19px;
  line-height: 1.7;
  margin: 18px 0;
}

textarea, input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd7ee;
  border-radius: 11px;
  font-size: 15px;
  outline-color: #a99bdb;
  font-family: inherit;
}

textarea { resize: vertical; }

.answer {
  background: #f0f8f2;
  padding: 15px;
  border-radius: 12px;
  margin-top: 12px;
  line-height: 1.7;
  display: none;
}

.progress {
  height: 8px;
  background: #eeeaf8;
  border-radius: 20px;
  overflow: hidden;
}

.bar {
  height: 100%;
  width: 0%;
  background: #a99bdb;
  transition: .3s;
}

.small {
  font-size: 13px;
  color: #9991aa;
}

.result {
  display: flex;
  justify-content: space-around;
  text-align: center;
  margin: 18px 0;
}

.result strong {
  display: block;
  font-size: 23px;
  color: #9381ca;
}

.editor-item {
  border: 1px solid #eeeaf8;
  border-radius: 13px;
  padding: 12px;
  margin-top: 12px;
}

.editor-item textarea { margin-top: 8px; }

.delete {
  background: #faeeee;
  color: #bd7777;
  margin-top: 8px;
}

.hidden { display: none; }

h3 { font-size: 17px; }
</style>
</head>

<body>

<header>
  <h1>English Translation</h1>
  <p>THE COLORFUL VILLAGES OF THE WORLD</p>
  <p>중학교 1학년 · 2학기 · Lesson 4</p>
</header>

<main>

<div class="card">
  <h3>오늘의 학습</h3>
  <div class="result">
    <div><strong id="total">0</strong><span class="small">전체 문제</span></div>
    <div><strong id="correct">0</strong><span class="small">맞힌 문제</span></div>
    <div><strong id="wrong">0</strong><span class="small">틀린 문제</span></div>
  </div>
  <div class="progress"><div class="bar" id="bar"></div></div>
</div>

<div class="tabs">
  <button class="active" onclick="selectPassage(0)">지문 1</button>
  <button onclick="selectPassage(1)">지문 2</button>
  <button onclick="selectPassage(2)">지문 3</button>
</div>

<div class="card">
  <h3 id="passageTitle">Passage 1</h3>
  <p class="small" id="number">문제 1</p>

  <div class="question" id="question">
    아직 등록된 문장이 없습니다.
  </div>

  <p class="small">위 문장을 영어로 번역해 보세요.</p>

  <textarea id="myAnswer" rows="4"
  placeholder="영어 문장을 입력하세요."></textarea>

  <button class="primary" onclick="showAnswer()">정답 확인</button>

  <div class="answer" id="answerBox">
    <b>모범 답안</b>
    <p id="correctAnswer"></p>
  </div>

  <button class="secondary" onclick="mark(true)">정답이에요</button>
  <button class="secondary" onclick="mark(false)">틀렸어요</button>
  <button class="primary" onclick="nextQuestion()">다음 문제 →</button>
</div>

<div class="card">
  <h3>문장 등록 및 수정</h3>
  <p class="small">
    교과서의 한국어 문장과 영어 정답을 직접 등록해 주세요.
    등록한 내용은 자동 저장됩니다.
  </p>

  <label>한국어 문장</label>
  <textarea id="newKorean" rows="2"
  placeholder="한국어 문장을 입력하세요."></textarea>

  <br><br>
  <label>영어 정답</label>
  <textarea id="newEnglish" rows="2"
  placeholder="영어 정답을 입력하세요."></textarea>

  <button class="primary" onclick="addQuestion()">+ 문장 추가하기</button>
</div>

<div class="card">
  <h3>등록된 문장 관리</h3>
  <div id="editorList"></div>
</div>

</main>

<script>
const initialData = [
  [], [], []
];

let data = JSON.parse(
  localStorage.getItem("translationData")
) || initialData;

let currentPassage = 0;
let currentQuestion = 0;
let results = JSON.parse(
  localStorage.getItem("translationResults")
) || { correct: 0, wrong: 0 };

function save() {
  localStorage.setItem("translationData", JSON.stringify(data));
  localStorage.setItem("translationResults", JSON.stringify(results));
}

function selectPassage(index) {
  currentPassage = index;
  currentQuestion = 0;

  document.querySelectorAll(".tabs button").forEach((b, i) => {
    b.classList.toggle("active", i === index);
  });

  render();
}

function render() {
  const list = data[currentPassage];

  document.getElementById("passageTitle").textContent =
    "Passage " + (currentPassage + 1);

  document.getElementById("total").textContent =
    data.reduce((sum, item) => sum + item.length, 0);

  document.getElementById("correct").textContent = results.correct;
  document.getElementById("wrong").textContent = results.wrong;

  const totalAnswered = results.correct + results.wrong;
  const percent = totalAnswered
    ? results.correct / totalAnswered * 100 : 0;

  document.getElementById("bar").style.width = percent + "%";

  if (!list.length) {
    document.getElementById("number").textContent = "문제 없음";
    document.getElementById("question").textContent =
      "아래 문장 등록 메뉴에서 문제를 추가해 주세요.";
    document.getElementById("myAnswer").value = "";
    document.getElementById("answerBox").style.display = "none";
    renderEditor();
    return;
  }

  if (currentQuestion >= list.length) currentQuestion = 0;

  document.getElementById("number").textContent =
    "문제 " + (currentQuestion + 1) + " / " + list.length;

  document.getElementById("question").textContent =
    list[currentQuestion].ko;

  document.getElementById("myAnswer").value = "";
  document.getElementById("correctAnswer").textContent =
    list[currentQuestion].en;

  document.getElementById("answerBox").style.display = "none";

  renderEditor();
}

function showAnswer() {
  if (!data[currentPassage].length) return;

  document.getElementById("correctAnswer").textContent =
    data[currentPassage][currentQuestion].en;

  document.getElementById("answerBox").style.display = "block";
}

function mark(isCorrect) {
  if (!data[currentPassage].length) {
    alert("먼저 문장을 등록해 주세요!");
    return;
  }

  if (isCorrect) results.correct++;
  else results.wrong++;

  save();
  render();
}

function nextQuestion() {
  if (!data[currentPassage].length) return;

  currentQuestion++;

  if (currentQuestion >= data[currentPassage].length) {
    currentQuestion = 0;
    alert("이 지문의 모든 문장을 확인했어요!");
  }

  render();
}

function addQuestion() {
  const ko = document.getElementById("newKorean").value.trim();
  const en = document.getElementById("newEnglish").value.trim();

  if (!ko || !en) {
    alert("한국어와 영어 정답을 모두 입력해 주세요.");
    return;
  }

  data[currentPassage].push({ ko, en });

  document.getElementById("newKorean").value = "";
  document.getElementById("newEnglish").value = "";

  save();
  render();

  alert("문장이 등록되었습니다!");
}

function renderEditor() {
  const container = document.getElementById("editorList");
  container.innerHTML = "";

  data[currentPassage].forEach((item, index) => {
    const div = document.createElement("div");
    div.className = "editor-item";

    const title = document.createElement("b");
    title.textContent = "문제 " + (index + 1);

    const ko = document.createElement("textarea");
    ko.rows = 2;
    ko.value = item.ko;
    ko.placeholder = "한국어 문장";

    const en = document.createElement("textarea");
    en.rows = 2;
    en.value = item.en;
    en.placeholder = "영어 정답";

    const edit = document.createElement("button");
    edit.className = "secondary";
    edit.textContent = "수정 저장";

    edit.onclick = () => {
      data[currentPassage][index] = {
        ko: ko.value.trim(),
        en: en.value.trim()
      };

      save();
      render();
      alert("수정되었습니다!");
    };

    const del = document.createElement("button");
    del.className = "delete";
    del.textContent = "문장 삭제";

    del.onclick = () => {
      if (confirm("이 문장을 삭제할까요?")) {
        data[currentPassage].splice(index, 1);
        currentQuestion = 0;
        save();
        render();
      }
    };

    div.append(title, ko, en, edit, del);
    container.appendChild(div);
  });
}

render();
</script>

</body>
</html>
